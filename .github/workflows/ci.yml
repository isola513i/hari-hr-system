name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    name: API Tests
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-test-secret-key-that-is-at-least-32-chars-long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check API
        run: cd apps/api && npx tsc --noEmit

      - name: Run API tests with coverage
        run: cd apps/api && npm test -- --coverage --forceExit

      - name: Upload API coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 7

  web-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check frontend
        run: cd apps/web && npx tsc --noEmit || true

      - name: Unit tests (Vitest)
        run: cd apps/web && npm test

      - name: Build frontend
        run: cd apps/web && npm run build
        env:
          VITE_API_URL: /api

  web-e2e:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking: specs require authenticated sessions and seeded HR data.
    # The backend is now wired (Postgres + API + schema init) so infrastructure
    # is in place; flip continue-on-error to false once the Playwright specs
    # are updated to use CI-friendly auth flows.
    continue-on-error: true

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hari_ci
          POSTGRES_PASSWORD: hari_ci_pass
          POSTGRES_DB: hari_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://hari_ci:hari_ci_pass@localhost:5432/hari_ci
      JWT_SECRET: ci-test-secret-key-that-is-at-least-32-chars-long
      NODE_ENV: test
      PORT: 3001
      ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialise database schema
        run: cd apps/api && npx ts-node src/scripts/init-db.ts

      - name: Seed demo data
        run: cd apps/api && npx ts-node src/scripts/seed-demo.ts
        continue-on-error: true

      - name: Start API server
        run: cd apps/api && npx ts-node src/index.ts &

      - name: Wait for API to be ready
        run: npx wait-on tcp:localhost:3001 --timeout 30000

      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd apps/web && npx playwright test
        env:
          CI: true
          VITE_API_URL: http://localhost:3001/api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
